<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý kí túc xá</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="main-container">
    <!-- Thanh danh mục bên trái -->
    <div class="sidebar">
      <h2>Quản lý kí túc xá</h2>
      <ul>
        <li>
          <button onclick="showScreen('student')">
            <i class="fas fa-user"></i> Sinh viên
          </button>
        </li>
        <li>
          <button onclick="showScreen('room-type')">
            <i class="fas fa-door-open"></i> Loại phòng
          </button>
        </li>
      </ul>
      <div class="logo-container">
        <img src="logo.png" alt="Logo Kí túc xá" />
      </div>
    </div>
    <!-- Phần nội dung hiển thị -->
    <div class="content">
      <!-- Quản lý Sinh viên -->
      <div id="student-screen" class="screen">
        <h1>Quản lý Sinh viên</h1>
        <div class="search-container">
          <input type="text" id="search-student" placeholder="Tìm kiếm sinh viên..." oninput="searchStudent()">
        </div>
        <button class="btn btn-success" onclick="addStudent()">Thêm Sinh viên</button>
        <table class="data-table">
          <thead>
            <tr>
              <th>Mã Sinh viên</th>
              <th>Họ và Tên</th>
              <th>Ngày sinh</th>
              <th>Khoa</th>
              <th>Lớp</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!-- Danh sách sinh viên được render từ script.js -->
          </tbody>
        </table>
      </div>

      <!-- Modal Thêm Sinh viên -->
      <div id="add-student-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Thêm Sinh viên</h2>
          <form id="add-student-form">
            <div class="form-group">
              <label for="student-id">Mã Sinh viên:</label>
              <input type="text" id="student-id" required>
            </div>
            <div class="form-group">
              <label for="student-name">Họ và Tên:</label>
              <input type="text" id="student-name" required>
            </div>
            <div class="form-group">
              <label for="student-date">Ngày sinh:</label>
              <input type="date" id="student-date" required>
            </div>
            <div class="form-group">
              <label for="student-major">Khoa:</label>
              <input type="text" id="student-major" required>
            </div>
            <div class="form-group">
              <label for="student-room">Lớp:</label>
              <input type="text" id="student-room" required>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-success" onclick="saveStudent()">Lưu</button>
              <button type="button" class="btn btn-danger" onclick="closeModal('add-student-modal')">Hủy</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Quản lý Loại phòng -->
      <div id="room-type-screen" class="screen hidden">
        <h1>Quản lý Loại Phòng</h1>
        <div class="search-container">
          <input type="text" id="search-room" placeholder="Tìm kiếm loại phòng..." oninput="searchRoomType()">
        </div>
        <button class="btn btn-success" onclick="addRoomType()">Thêm Loại Phòng</button>
        <table class="data-table">
          <thead>
            <tr>
              <th>Số phòng</th>
              <th>Tên Loại phòng</th>
              <th>Giá thuê (VNĐ)</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!-- Danh sách loại phòng được render từ script.js -->
          </tbody>
        </table>
      </div>

      <!-- Modal Thêm Loại Phòng -->
      <div id="add-room-type-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Thêm Loại Phòng</h2>
          <form id="add-room-type-form">
            <div class="form-group">
              <label for="room-type-id">Số phòng:</label>
              <input type="text" id="room-type-id" required>
            </div>
            <div class="form-group">
              <label for="room-type-name">Tên Loại Phòng:</label>
              <input type="text" id="room-type-name" required>
            </div>
            <div class="form-group">
              <label for="room-type-price">Giá thuê (VNĐ):</label>
              <input type="number" id="room-type-price" required>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-success" onclick="saveRoomType()">Lưu</button>
              <button type="button" class="btn btn-danger" onclick="closeModal('add-room-type-modal')">Hủy</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
